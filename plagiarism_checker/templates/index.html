{% extends "base.html" %}

{% block title %}Home - Plagiarism Checker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="card-title mb-0">Check Plagiarism</h2>
            </div>
            <div class="card-body">
                <form action="{{ url_for('check') }}" method="post">
                    <div class="mb-3">
                        <label for="text1" class="form-label">Text 1</label>
                        <textarea class="form-control" id="text1" name="text1" rows="6" placeholder="Enter your first text here..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="text2" class="form-label">Text 2</label>
                        <textarea class="form-control" id="text2" name="text2" rows="6" placeholder="Enter your second text here..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Check Similarity</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
